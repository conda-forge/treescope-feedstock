schema_version: 1

context:
  name: treescope
  version: "0.1.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/treescope-${{ version }}.tar.gz
  sha256: 8ee25a31dd6d74518aeda636ae362ecb8e91469f63915391cf5f23f65418e9ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.8,<4
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.25.2

tests:
  - python:
      imports:
        - treescope
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: An interactive HTML pretty-printer for ML research in IPython notebooks.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/google-deepmind/treescope#readme
  documentation: https://treescope.readthedocs.io/

extra:
  recipe-maintainers:
    - thewchan
